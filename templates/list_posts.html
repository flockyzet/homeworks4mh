<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Все публикации</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .posts-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 42px;
            color: #243b5a;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-line {
            height: 2px;
            background: #dce3eb;
            margin-bottom: 30px;
        }

        .post-card {
            background: white;
            border-radius: 14px;
            padding: 28px 30px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #edf0f4;
        }

        /* Заголовок поста */
        .post-title {
            font-size: 27px;
            margin: 0 0 16px 0;
        }

        /* Ссылка-заголовок */
        .post-title a {
            color: #243b5a;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }

        /* При наведении */
        .post-title a:hover {
            color: #2f5d8c;
            text-decoration: underline;
        }

        .post-preview,
        .post-full-text {
            font-size: 18px;
            line-height: 1.7;
            color: #3d4652;
        }

        .post-full-text {
            display: none;
            margin-top: 15px;
            white-space: pre-line;
        }

        .post-full-text.open {
            display: block;
        }

        .read-more-btn {
            border: none;
            background: #2f5d8c;
            color: white;
            padding: 10px 17px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .read-more-btn:hover {
            background: #244a70;
        }

        .post-status {
            color: #7c8794;
            font-size: 14px;
            margin-top: 18px;
        }

        .empty-posts {
            background: white;
            border: 1px solid #e4e8ed;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            color: #697586;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="posts-container">

    <h1 class="page-title">Все публикации</h1>

    <div class="page-line"></div>

    {% for post in posts %}

        <article class="post-card">

            <!-- Заголовок теперь является ссылкой -->
            <h2 class="post-title">
                <a href="{% url 'post_detail' post.pk %}">
                    {{ post.title }}
                </a>
            </h2>

            <!-- Краткий текст -->
            <div class="post-preview">
                {{ post.text|truncatechars:180 }}
            </div>

            <!-- Полный текст -->
            <div
                id="full-text-{{ post.pk }}"
                class="post-full-text"
            >
                {{ post.text }}
            </div>

            <!-- Кнопка полного текста -->
            {% if post.text|length > 180 %}

                <button
                    type="button"
                    class="read-more-btn"
                    onclick="toggleText('{{ post.pk }}', this)"
                >
                    Читать полностью
                </button>

            {% endif %}

            <div class="post-status">
                Опубликовано
            </div>

        </article>

    {% empty %}

        <div class="empty-posts">
            Пока нет опубликованных постов.
        </div>

    {% endfor %}

</div>

<script>
    function toggleText(postId, button) {

        const text = document.getElementById("full-text-" + postId);

        if (text.classList.contains("open")) {

            text.classList.remove("open");
            button.textContent = "Читать полностью";

        } else {

            text.classList.add("open");
            button.textContent = "Свернуть";

        }
    }
</script>

</body>
</html>
