<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список постов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        .post-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        .post-title {
            margin: 0 0 10px 0;
            font-size: 1.3em;
        }
        .post-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        .post-title a:hover {
            color: #3498db;
        }
        .post-snippet {
            color: #555;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .post-date {
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Все публикации</h1>

    {% for post in posts %}
        <div class="post-card">
            <h2 class="post-title">
                <a href="/posts/{{ post.id }}/">{{ post.title }}</a>
            </h2>
            <p class="post-snippet">{{ post.text|truncatewords:20 }}</p>
            <div class="post-date">Опубликовано: {{ post.created_at|date:"d.m.Y H:i" }}</div>
        </div>
    {% empty %}
        <p style="color: #777;">Постов пока нет.</p>
    {% endfor %}

</body>
</html
